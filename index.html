<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d52" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Caroly" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Caroly</title>
</head>
<body>
  <header class="app-header">
    <div class="date-nav">
      <button id="prev-day" class="icon-btn" type="button" aria-label="Día anterior">‹</button>
      <div class="date-label">
        <span id="date-text">Hoy</span>
        <span id="date-subtext"></span>
      </div>
      <button id="next-day" class="icon-btn" type="button" aria-label="Día siguiente">›</button>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <main class="meals" id="meals"></main>

  <!-- Food picker -->
  <section id="picker" class="overlay" hidden>
    <div class="sheet">
      <header class="sheet-header">
        <h2 id="picker-title">Añadir alimento</h2>
        <button class="icon-btn" id="picker-close" type="button" aria-label="Cerrar">✕</button>
      </header>
      <div class="sheet-toolbar">
        <input id="picker-search" type="search" placeholder="Buscar alimento..." autocomplete="off" />
        <button id="new-food-btn" class="btn btn-primary" type="button">＋ Nuevo</button>
      </div>
      <ul id="picker-list" class="food-list"></ul>
    </div>
  </section>

  <!-- New food form -->
  <section id="food-form" class="overlay" hidden>
    <div class="sheet">
      <header class="sheet-header">
        <h2>Nuevo alimento</h2>
        <button class="icon-btn" id="food-form-close" type="button" aria-label="Cerrar">✕</button>
      </header>
      <form id="new-food-form" class="sheet-body" novalidate>
        <label class="field">
          <span>Nombre</span>
          <input id="food-name" type="text" autocomplete="off" />
        </label>
        <fieldset class="unit-toggle">
          <legend>Unidad</legend>
          <label><input type="radio" name="unit" value="g" checked /> gramos (g)</label>
          <label><input type="radio" name="unit" value="ml" /> mililitros (ml)</label>
        </fieldset>
        <p class="hint">Valores por 100 g/ml:</p>
        <div class="grid-2">
          <label class="field">
            <span>Calorías (kcal)</span>
            <input id="food-kcal" type="number" inputmode="decimal" min="0" step="0.1" />
          </label>
          <label class="field">
            <span>Proteínas (g)</span>
            <input id="food-protein" type="number" inputmode="decimal" min="0" step="0.1" />
          </label>
          <label class="field">
            <span>Hidratos (g)</span>
            <input id="food-carbs" type="number" inputmode="decimal" min="0" step="0.1" />
          </label>
          <label class="field">
            <span>Grasas (g)</span>
            <input id="food-fat" type="number" inputmode="decimal" min="0" step="0.1" />
          </label>
        </div>
        <p id="food-form-error" class="error" hidden></p>
        <div class="sheet-actions">
          <button type="button" class="btn" id="food-form-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Quantity entry -->
  <section id="quantity-form" class="overlay" hidden>
    <div class="sheet">
      <header class="sheet-header">
        <h2 id="quantity-title">Cantidad</h2>
        <button class="icon-btn" id="quantity-close" type="button" aria-label="Cerrar">✕</button>
      </header>
      <div class="sheet-body">
        <div id="quantity-info" class="per100-info"></div>
        <label class="field">
          <span id="quantity-label">Cantidad (g)</span>
          <input id="quantity-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0" />
        </label>
        <div id="quantity-result" class="result"></div>
        <div class="sheet-actions">
          <button type="button" class="btn" id="quantity-cancel">Cancelar</button>
          <button type="button" class="btn btn-primary" id="quantity-confirm">Añadir</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
